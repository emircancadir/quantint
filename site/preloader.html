<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#F7F8FA; color:#111827; font-family:'Archivo',Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:#2563EB; text-decoration:none; }
  a:hover { color:#1D4ED8; }
</style>
</helmet>

<div lang="tr" style="min-height:100vh; background:#F7F8FA; overflow:hidden;">

  <!-- placeholder hero (only to demonstrate the handoff) -->
  <sc-if value="{{ showHero }}" hint-placeholder-val="{{ true }}">
    <main style="max-width:1080px; margin:0 auto; padding:120px 40px 80px; display:grid; grid-template-columns:1.1fr .9fr; gap:64px; align-items:center;">
      <div>
        <div style="font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:#2563EB; font-weight:600; margin-bottom:18px;">quantitative finance · veri bilimi · ml</div>
        <h1 style="margin:0 0 18px; font-size:52px; line-height:1.08; font-weight:700; letter-spacing:-0.03em;">Piyasaları<br>veriyle okuyun.</h1>
        <p style="margin:0; font-size:17px; line-height:1.6; color:#6B7280; max-width:44ch;">Kantitatif finans, istatistik ve makine öğrenmesi üzerine derinlemesine içerik. Teoriden koda.</p>
      </div>
      <div style="position:relative; height:340px; border:1px solid #E5E7EB; border-radius:12px; background:#FFFFFF;">
        <span style="position:absolute; left:26px; top:26px; bottom:26px; width:1px; background:#EDEFF2;"></span>
        <span style="position:absolute; left:26px; right:26px; bottom:26px; height:1px; background:#EDEFF2;"></span>
        <sc-for list="{{ scatterPts }}" as="sp" hint-placeholder-count="20">
          <span style="position:absolute; left:{{ sp.left }}%; top:{{ sp.top }}%; width:{{ sp.size }}px; height:{{ sp.size }}px; border-radius:50%; background:{{ sp.color }};"></span>
        </sc-for>
        <span style="position:absolute; right:20px; bottom:8px; font-size:10.5px; color:#9CA3AF; letter-spacing:.08em;">fig. 01 — nokta bulutu</span>
      </div>
    </main>
  </sc-if>

  <!-- preloader overlay: visible by default, highest z-index -->
  <sc-if value="{{ preActive }}" hint-placeholder-val="{{ true }}">
    <div ref="{{ rootRef }}" style="position:fixed; inset:0; z-index:9999; background:#F7F8FA; opacity:1; pointer-events:none;">
      <div ref="{{ logoRef }}" style="position:absolute; left:50%; top:50%; width:0; height:0; margin-left:{{ qLeft }}px;">
        <sc-for list="{{ preDots }}" as="d" hint-placeholder-count="9">
          <span ref="{{ d.ref }}" style="position:absolute; left:0; top:0; width:{{ d.size }}px; height:{{ d.size }}px; margin-left:{{ d.ml }}px; margin-top:{{ d.mt }}px; border-radius:50%; background:{{ d.color }}; transform:{{ d.transform }}; will-change:transform;"></span>
        </sc-for>
      </div>
      <div ref="{{ wordRef }}" style="position:absolute; left:50%; top:50%; margin-left:{{ wordLeft }}px; margin-top:{{ wordTop }}px; display:inline-flex; font-size:{{ fontSize }}px; line-height:1.2; font-weight:600; letter-spacing:-0.02em; color:#111827; white-space:nowrap; will-change:transform;">
        <sc-for list="{{ preLetters }}" as="ch" hint-placeholder-count="9">
          <span style="display:inline-block; overflow:hidden; vertical-align:bottom;"><span ref="{{ ch.ref }}" style="display:inline-block; transform:{{ ch.transform }}; color:{{ ch.color }}; will-change:transform;">{{ ch.char }}</span></span>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <button onClick="{{ replay }}" style="position:fixed; right:20px; bottom:20px; z-index:10000; border:1px solid #E5E7EB; background:#FFFFFF; color:#111827; font-family:'Archivo',Helvetica,sans-serif; font-size:13px; font-weight:600; padding:9px 16px; border-radius:999px; cursor:pointer; box-shadow:0 2px 8px rgba(17,24,39,.06);" style-hover="border-color:#2563EB; color:#2563EB;">↻ Replay</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;speed&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0.4, &quot;max&quot;: 2, &quot;step&quot;: 0.1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Animasyon&quot;}, &quot;showHero&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Sahne&quot;}}">
class Component extends DCLogic {
  state = { done: false, run: 0 };

  componentDidMount() {
    this._dotEls = this._dotEls || [];
    this._letterEls = this._letterEls || [];
    this._start();
  }
  componentWillUnmount() { this._stop(); }

  _stop() {
    if (this._raf) cancelAnimationFrame(this._raf);
    this._raf = null;
    [this._t1, this._t2].forEach(clearTimeout);
  }

  _cfgGet() {
    if (this._cfg) return this._cfg;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const w = document.documentElement.clientWidth || 1200;
    const s = Math.min(2.2, Math.max(1.1, w / 300));
    const fontSize = Math.round(27.3 * s);
    const lockupW = 64 * s + 24 + fontSize * 4.35;
    const DOTS = [
      [30, 5, 4.9, 0], [47.7, 12.3, 4.9, 0], [55, 30, 4.9, 0], [47.7, 47.7, 4.9, 1],
      [30, 55, 4.9, 0], [12.3, 47.7, 4.9, 0], [5, 30, 4.9, 0], [12.3, 12.3, 4.9, 0],
      [59.1, 59.1, 4.9, 1]
    ];
    const params = DOTS.map((d, i) => {
      const tx = d[0] * s, ty = (d[1] - 30) * s, size0 = 2 * d[2] * s;
      const dx = tx - 30 * s, dy = ty;
      const frac = (i * 0.618034) % 1;
      const spin = Math.PI * (0.6 + 0.5 * frac);
      return {
        tx, ty, size0, blue: !!d[3], spin,
        a0: Math.atan2(dy, dx) - spin,
        R: (Math.hypot(dx, dy) + 21 * s) / 2 + 3 * Math.sin(i * 2.4),
        wf: 2.2 + 1.3 * frac, wp: i * 1.7
      };
    });
    this._cfg = { mode: reduce ? 'static' : 'anim', s, fontSize, params, qLeft: -lockupW / 2, wordLeft: -lockupW / 2 + 64 * s + 24 };
    return this._cfg;
  }

  _orbitPos(p, t) {
    const s = this._cfgGet().s;
    const prog = 1 - Math.pow(1 - Math.min(t, 1), 1.6);
    const a = p.a0 + p.spin * prog + 0.08 * Math.sin(t * p.wf * 3 + p.wp);
    const r = p.R + 2.5 * Math.sin(t * 2.6 + p.wp);
    return [30 * s + r * Math.cos(a), r * Math.sin(a)];
  }

  _start() {
    const cfg = this._cfgGet();
    cfg.params.forEach((p) => { delete p._o1; delete p._blued; });
    this._disp = 0; this._perSwap = 0;
    if (this._root) { this._root.style.transition = 'none'; this._root.style.opacity = '1'; }
    if (this._word) this._word.style.transform = 'none';
    cfg.params.forEach((p, i) => { const el = this._dotEls[i]; if (el) el.style.background = '#111827'; });
    if (cfg.mode === 'static') {
      cfg.params.forEach((p, i) => {
        const el = this._dotEls[i];
        if (el) { el.style.transform = 'translate(' + p.tx + 'px,' + p.ty + 'px)'; el.style.background = p.blue ? '#2563EB' : '#111827'; }
      });
      this._letterEls.forEach((el) => { if (el) el.style.transform = 'none'; });
      this._t1 = setTimeout(() => {
        if (this._root) { this._root.style.transition = 'opacity .5s ease'; this._root.style.opacity = '0'; }
      }, 600);
      this._t2 = setTimeout(() => this.setState({ done: true }), 1150);
      return;
    }
    this._tick0 = performance.now();
    this._stepB = (n) => this._tick(n);
    this._raf = requestAnimationFrame(this._stepB);
  }

  _tick(now) {
    const cfg = this._cfgGet();
    const rate = Math.max(0.2, Math.min(3, this.props.speed ?? 1));
    const t = (now - this._tick0) / 1000 * rate;
    const clamp = (u) => Math.max(0, Math.min(1, u));
    const eIO = (u) => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    const eOC = (u) => 1 - Math.pow(1 - u, 3);
    const eIC = (u) => u * u * u;
    const eOB = (u) => { const c = 1.9, v = u - 1; return 1 + (c + 1) * v * v * v + c * v * v; };
    if (t >= 2.15 && !this._disp) {
      this._disp = 1;
      const far = Math.max(window.innerWidth, window.innerHeight) * 0.62;
      cfg.params.forEach((p, i) => {
        const ang = Math.atan2(p.ty, p.tx - 30 * cfg.s) + (i % 2 ? 0.35 : -0.35);
        const dist = far + i * 34;
        p.out = [p.tx + Math.cos(ang) * dist, p.ty + Math.sin(ang) * dist];
        const dx = p.out[0] - p.tx, dy = p.out[1] - p.ty, sgn = i % 2 ? 1 : -1;
        p.ctrl = [p.tx + dx * 0.5 - dy * 0.2 * sgn, p.ty + dy * 0.5 + dx * 0.2 * sgn];
      });
    }
    cfg.params.forEach((p, i) => {
      const el = this._dotEls[i];
      if (!el) return;
      let x, y;
      if (t < 1) { const o = this._orbitPos(p, t); x = o[0]; y = o[1]; }
      else {
        if (!p._o1) p._o1 = this._orbitPos(p, 1);
        const e2 = eOB(clamp((t - 1 - i * 0.022) / 0.62));
        x = p._o1[0] + (p.tx - p._o1[0]) * e2;
        y = p._o1[1] + (p.ty - p._o1[1]) * e2;
        if (p.blue && !p._blued && t > 1.28 + i * 0.022) { p._blued = 1; el.style.background = '#2563EB'; }
        if (this._disp && p.out) {
          const u3 = clamp((t - 2.15 - i * 0.025) / 0.78);
          if (u3 > 0) {
            const e3 = eIC(u3), a = 1 - e3;
            x = a * a * p.tx + 2 * a * e3 * p.ctrl[0] + e3 * e3 * p.out[0];
            y = a * a * p.ty + 2 * a * e3 * p.ctrl[1] + e3 * e3 * p.out[1];
          }
        }
      }
      el.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px)';
    });
    for (let li = 0; li < 9; li++) {
      const el = this._letterEls[li];
      if (!el) continue;
      if (li < 8) {
        const u = clamp((t - 1.02 - li * 0.055) / 0.42);
        el.style.transform = 'translateY(' + ((1 - eOC(u)) * 115).toFixed(1) + '%)';
      } else {
        const u = clamp((t - 1.48) / 0.34);
        el.style.transform = 'scale(' + (u <= 0 ? 0 : eOB(u)).toFixed(3) + ')';
      }
    }
    if (this._root && t >= 2.35) {
      const f = clamp((t - 2.35) / 0.6);
      this._root.style.opacity = (1 - f).toFixed(3);
      if (this._word) this._word.style.transform = 'translateY(' + (-16 * eIO(f)).toFixed(1) + 'px)';
    }
    if (t >= 3.0) { this.setState({ done: true }); this._raf = null; return; }
    this._raf = requestAnimationFrame(this._stepB);
  }

  renderVals() {
    this._dotEls = this._dotEls || [];
    this._letterEls = this._letterEls || [];
    const cfg = this._cfgGet();
    const isStatic = cfg.mode === 'static';
    const preDots = cfg.params.map((p, i) => {
      let transform, color = '#111827';
      if (isStatic) { transform = 'translate(' + p.tx + 'px,' + p.ty + 'px)'; if (p.blue) color = '#2563EB'; }
      else { const o = this._orbitPos(p, 0); transform = 'translate(' + o[0].toFixed(1) + 'px,' + o[1].toFixed(1) + 'px)'; }
      return { size: p.size0, ml: -p.size0 / 2, mt: -p.size0 / 2, color, transform, ref: (el) => { if (el) this._dotEls[i] = el; } };
    });
    const preLetters = 'quantint.'.split('').map((c, i) => ({
      char: c, color: c === '.' ? '#2563EB' : '#111827',
      transform: isStatic ? 'none' : (c === '.' ? 'scale(0)' : 'translateY(115%)'),
      ref: (el) => { if (el) this._letterEls[i] = el; }
    }));
    const scatterPts = Array.from({ length: 26 }, (_, i) => {
      const a = (i * 0.618034) % 1, b = ((i * 37 + 11) % 26) / 26 * 0.9 + Math.sin(i * 12.9898) * 0.06 + 0.05;
      return {
        left: (10 + a * 82).toFixed(1), top: (8 + b * 76).toFixed(1),
        size: 5 + ((i * 7) % 3) * 2,
        color: i % 6 === 0 ? 'rgba(37,99,235,.4)' : 'rgba(17,24,39,.16)'
      };
    });
    return {
      preActive: !this.state.done,
      showHero: this.props.showHero ?? true,
      qLeft: cfg.qLeft, wordLeft: cfg.wordLeft,
      fontSize: cfg.fontSize, wordTop: -Math.round(cfg.fontSize * 0.6),
      preDots, preLetters, scatterPts,
      replay: () => {
        this._stop();
        this.setState({ done: false, run: this.state.run + 1 });
        this._t1 = setTimeout(() => this._start(), 40);
      },
      rootRef: (el) => { if (el) this._root = el; },
      logoRef: (el) => { if (el) this._logo = el; },
      wordRef: (el) => { if (el) this._word = el; }
    };
  }
}
</script>
</body>
</html>
